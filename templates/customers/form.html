{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <div>
        <p class="tiny">Customers</p>
        <h1>{{ page_heading }}</h1>
    </div>
</div>
<form method="post" class="panel form-grid" style="max-width:640px">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="two-col" style="grid-template-columns:1fr 1fr">
        <label>First name{{ form.first_name }}{{ form.first_name.errors }}</label>
        <label>Last name{{ form.last_name }}{{ form.last_name.errors }}</label>
    </div>
    <label>Email{{ form.email }}{{ form.email.errors }}</label>
    <label>Phone{{ form.phone }}{{ form.phone.errors }}</label>
    <div class="two-col" style="grid-template-columns:1fr 1fr">
        <label>City{{ form.city }}{{ form.city.errors }}</label>
        <label>Country{{ form.country }}{{ form.country.errors }}</label>
    </div>
    <label>Passport number{{ form.passport }}{{ form.passport.errors }}</label>
    <label>Nationality{{ form.nationality }}{{ form.nationality.errors }}</label>
    <label>Notes{{ form.notes }}{{ form.notes.errors }}</label>
    <div class="actions">
        <button class="btn btn-warm" type="submit">{{ submit_label|default:"Save customer" }}</button>
        <a class="btn btn-ghost" href="{% url 'customers:list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
