<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{{ page_title }}{% endblock %} · {{ brand.name }}</title>

    {% load static %}

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/country-select-js@2.1.0/build/css/countrySelect.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
    navy: "#0D1B2A",
    "brand-blue-dark": "#1E3A8A",
    "brand-blue": "#2563EB",
    "brand-teal": "#14B8A6",
    "brand-green": "#34D399",
    "brand-purple": "#8B5CF6"
}
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>

<body class="bg-slate-100 text-slate-900">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        {% include "components/sidebar.html" %}

        <!-- Main area -->
        <div class="flex-1 min-w-0 flex flex-col">

            <!-- Navbar -->
            {% include "components/navbar.html" %}

            <!-- Page content -->
            <main class="flex-1 p-6 overflow-auto">

                {% include "components/alerts.html" %}

                {% block content %}{% endblock %}

            </main>

        </div>

    </div>

    <div class="toast" id="app-toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/country-select-js@2.1.0/build/js/countrySelect.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/intlTelInput.min.js"></script>
    <script src="{% static 'js/app.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>

</html>
