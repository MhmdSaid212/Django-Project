<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TourOps - Travel Agency Operations & Finance{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 flex min-h-screen antialiased selection:bg-[#00B49F] selection:text-white">
  
  <!-- TourOps Sidebar -->
  {% include "components/sidebar.html" %}

  <!-- Main View Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <main class="p-6 lg:p-8 flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
