{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <div>
        <p class="tiny">Account</p>
        <h1>Change password</h1>
        <p>Passwords are hashed. Sessions never store the hash.</p>
    </div>
</div>
<form method="post" class="panel form-grid" style="max-width:420px">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Current password{{ form.current_password }}{{ form.current_password.errors }}</label>
    <label>New password{{ form.new_password }}{{ form.new_password.errors }}</label>
    <label>Confirm new password{{ form.confirm_password }}{{ form.confirm_password.errors }}</label>
    <div class="actions">
        <button class="btn btn-warm" type="submit">Update password</button>
        <a class="btn btn-ghost" href="{% url 'dashboard:home' %}">Cancel</a>
    </div>
</form>
{% endblock %}
