<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sign in{% endblock %} · {{ brand.name }}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
    <main class="auth-card">
        <div class="brand-lockup">
            <div class="brand-mark">T</div>
            <div>
                <h1>{{ brand.name }}</h1>
                <p class="muted">{{ brand.subtitle }}</p>
                <p class="tagline">{{ brand.tagline }}</p>
            </div>
        </div>
        {% include "components/alerts.html" %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
