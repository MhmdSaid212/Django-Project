{% load tourops static %}
<aside class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="{% url nav.dashboard %}">
        <img src="{% static 'images/logo-dark.png' %}" alt="{{ brand.name }}" style="height:42px;width:auto;">
    </a>
    <nav class="sidebar-nav">
        <p class="nav-label">Main</p>
        <a class="{% nav_active 'dashboard' %}" href="{% url nav.dashboard %}">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
            <span>Dashboard</span>
        </a>
        {% if nav.ops %}
        <a class="{% nav_active 'customers' %}" href="{% url 'customers:list' %}">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19c.8-3 2.8-4.5 5-4.5S13.2 16 14 19"/><circle cx="17" cy="9" r="2.2"/><path d="M16.2 14.5c2 .3 3.5 1.6 4.3 4.5"/></svg>
            <span>Customers</span>
        </a>
        <a class="{% nav_active 'bookings' %}" href="{% url 'bookings:list' %}">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18.5" cy="17" r="2"/></svg>
            <span>Bookings</span>
        </a>

    <a href="/bookings/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/bookings' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span>Bookings</span>
    </a>

    <a href="/customers/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/customers' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <span>Customers</span>
    </a>

    <a href="/suppliers/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/suppliers' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      <span>Suppliers</span>
    </a>

    <a href="/tours/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/tours' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      <span>Tours</span>
    </a>

    <a href="/packages/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/packages' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m4 4v10M4 7v10l8 4"/></svg>
      <span>Packages</span>
    </a>

    <a href="/invoices/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/invoices' in request.path or '/finance' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>Finance</span>
    </a>

    <a href="/reports/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/reports' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Reports</span>
    </a>

    <a href="/settings/" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-sm font-medium transition {% if '/settings' in request.path %}bg-[#00B49F] text-white font-semibold shadow-sm{% else %}text-slate-300 hover:bg-slate-800/70 hover:text-white{% endif %}">
      <svg class="w-5 h-5 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- User Profile Footer -->
  <div class="p-4 border-t border-slate-800/80 bg-[#07101E]/80 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-[#00B49F] text-white flex items-center justify-center text-xs font-bold shadow-sm">
        SJ
      </div>
      <div>
        <p class="text-xs font-bold text-white leading-tight">Sarah Johnson</p>
        <p class="text-[11px] text-slate-400">Admin</p>
      </div>
    </div>
    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
</aside>
