{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Revenue vs cost</h1><p>Booked customer revenue against incurred expenses for the selected range.</p></div></div>
<div class="money-split">
    <div class="money-in">
        <span class="tiny">Revenue</span>
        <div style="font-size:1.6rem;font-weight:750">$49,640</div>
        <div class="bar"><i style="width:100%"></i></div>
    </div>
    <div class="money-out">
        <span class="tiny">Costs</span>
        <div style="font-size:1.6rem;font-weight:750">$35,300</div>
        <div class="bar"><i style="width:71%"></i></div>
    </div>
</div>
<p class="muted" style="margin-top:1rem">Filters: date range, tour, supplier, customer — wireframe controls.</p>
<div class="filters">
    <input class="field" type="date"> <span class="muted">to</span> <input class="field" type="date">
    <select class="field"><option>All tours</option></select>
    <button class="btn btn-ghost" type="button">Export PDF</button>
</div>
{% endblock %}
