{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Cash flow</h1><p>Customer payments in versus supplier payments and expenses out.</p></div></div>
<div class="money-split">
    <div class="money-in">
        <span class="tiny">In</span>
        <div style="font-size:1.6rem;font-weight:750">$18,420</div>
        <p class="muted">Customer payments this month</p>
    </div>
    <div class="money-out">
        <span class="tiny">Out</span>
        <div style="font-size:1.6rem;font-weight:750">$6,120</div>
        <p class="muted">Supplier payments + expenses</p>
    </div>
</div>
<p style="margin-top:1rem;font-size:1.2rem;font-weight:750">Net $12,300</p>
{% endblock %}
